name: CI

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version:
          - 18
          - 20
          - 22
          - 24

    steps:
      - name: Check out the repository
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run the TypeScript checker
        run: npm run typecheck

      - name: Run the test suite
        run: npm test

      - name: Install Chromium for browser regression
        if: matrix.node-version == 24
        run: npx playwright install --with-deps chromium

      - name: Run the browser smoke suite
        if: matrix.node-version == 24
        run: npm run test:browser

      - name: Run the benchmark regression gate
        if: matrix.node-version == 24
        run: npm run test:benchmark

      - name: Upload browser regression artifacts
        if: matrix.node-version == 24 && always()
        uses: actions/upload-artifact@v4
        with:
          name: qore-browser-regression-node-24
          path: |
            test-results
            playwright-report
          if-no-files-found: warn
          retention-days: 14

      - name: Verify committed dist artifacts are current
        run: npm run check:dist

      - name: Run the package type smoke test
        run: npm run smoke:package-types

      - name: Run the package runtime smoke test
        run: npm run smoke:package-runtime

      - name: Run the React adapter package smoke test
        if: matrix.node-version == 24
        run: npm run smoke:react-package
