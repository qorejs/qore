name: Publish GitHub Packages

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Optional release tag to validate against package.json
        required: false
        type: string
  release:
    types:
      - published

permissions:
  contents: read
  packages: write

concurrency:
  group: publish-github-packages-${{ github.workflow }}-${{ github.ref || github.event.release.tag_name || github.run_id }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest

    steps:
      - name: Check out the repository
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium for browser regression
        run: npx playwright install --with-deps chromium

      - name: Verify release tag and changelog
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name || github.event.inputs.release_tag }}
        run: |
          node --input-type=module <<'EOF'
          import fs from 'node:fs';

          const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8'));
          const changelog = fs.readFileSync('CHANGELOG.md', 'utf8');
          const rawTag = process.env.RELEASE_TAG?.trim() ?? '';
          const normalizedTag = rawTag.replace(/^v/, '');

          if (rawTag && normalizedTag !== pkg.version) {
            throw new Error(`Release tag "${rawTag}" does not match package.json version "${pkg.version}".`);
          }

          const changelogHeading = new RegExp(`^##\\s+${pkg.version}\\b`, 'm');

          if (!changelogHeading.test(changelog)) {
            throw new Error(`CHANGELOG.md is missing a heading for version ${pkg.version}.`);
          }

          console.log(`Validated package.json version ${pkg.version}.`);
          EOF

      - name: Run release checks
        run: npm run release:check

      - name: Upload browser regression artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qore-github-packages-browser-regression
          path: |
            test-results
            playwright-report
          if-no-files-found: warn
          retention-days: 14

  publish:
    runs-on: ubuntu-latest
    needs: verify

    steps:
      - name: Check out the repository
        uses: actions/checkout@v5

      - name: Set up Node.js for GitHub Packages
        uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: https://npm.pkg.github.com
          scope: '@qorejs'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build the published package
        run: npm run build

      - name: Publish the package to GitHub Packages
        run: npm run publish:github
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
