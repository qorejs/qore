name: Publish npm Package

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Optional release tag to validate against package.json
        required: false
        type: string
  release:
    types:
      - published

permissions:
  contents: read
  id-token: write

concurrency:
  group: publish-npm-${{ github.workflow }}-${{ github.ref || github.event.release.tag_name || github.run_id }}
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - name: Check out the repository
        uses: actions/checkout@v5

      - name: Set up Node.js for trusted publishing
        uses: actions/setup-node@v5
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      - name: Check whether npm version already exists
        id: npm-version
        run: |
          VERSION=$(node -p "JSON.parse(require('node:fs').readFileSync('package.json', 'utf8')).version")

          if npm view "@qorejs/qore@$VERSION" version --registry=https://registry.npmjs.org >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "npm already has @qorejs/qore@$VERSION; skipping publish."
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo "npm does not have @qorejs/qore@$VERSION yet; continuing publish."
          fi

      - name: Install dependencies
        if: steps.npm-version.outputs.exists != 'true'
        run: npm ci

      - name: Install Chromium for browser regression
        if: steps.npm-version.outputs.exists != 'true'
        run: npx playwright install --with-deps chromium

      - name: Verify release tag and changelog
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name || github.event.inputs.release_tag }}
        run: |
          node --input-type=module <<'EOF_NODE'
          import fs from 'node:fs';

          const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8'));
          const changelog = fs.readFileSync('CHANGELOG.md', 'utf8');
          const rawTag = process.env.RELEASE_TAG?.trim() ?? '';
          const normalizedTag = rawTag.replace(/^v/, '');

          if (rawTag && normalizedTag !== pkg.version) {
            throw new Error(`Release tag "${rawTag}" does not match package.json version "${pkg.version}".`);
          }

          const changelogHeading = new RegExp(`^##\\s+${pkg.version}\\b`, 'm');

          if (!changelogHeading.test(changelog)) {
            throw new Error(`CHANGELOG.md is missing a heading for version ${pkg.version}.`);
          }

          console.log(`Validated package.json version ${pkg.version}.`);
          EOF_NODE

      - name: Run release checks
        if: steps.npm-version.outputs.exists != 'true'
        run: npm run release:check

      - name: Resolve npm dist-tag
        if: steps.npm-version.outputs.exists != 'true'
        id: release-channel
        run: echo "tag=$(node ./scripts/release-version.mjs --tag)" >> "$GITHUB_OUTPUT"

      - name: Publish to npm
        if: steps.npm-version.outputs.exists != 'true'
        run: npm publish --access public --provenance --tag ${{ steps.release-channel.outputs.tag }}
